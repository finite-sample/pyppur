[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[project]
name = "pyppur"
version = "0.5.0"
description = "Advanced Projection Pursuit implementation with tied/untied weights, nonlinear/linear distance distortion, and comprehensive documentation"
readme = "README.md"
authors = [
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0", 
    "scikit-learn>=1.0.0",
    "matplotlib>=3.3.0",
]

[project.urls]
"Homepage" = "https://github.com/finite-sample/pyppur"
"Bug Tracker" = "https://github.com/finite-sample/pyppur/issues"


[dependency-groups]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.7.0",
    "pyright>=1.1.390",
    "pydoclint>=0.5.0",
    "pre-commit>=3.0",
]
test = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300",
    # sklearn API convention: the data matrix is capitalized (X, X_train, X_recon)
    # throughout the public API and everything that calls it.
    "N803", "N806",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]
# Demo scripts and research benchmarks communicate through stdout by design.
"pyppur/examples/**" = ["T201"]
"experiments/**" = ["T201"]

[tool.pyright]
include = ["pyppur"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
exclude = ["**/__pycache__", "build", "dist"]
reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateImportUsage = false
stubPath = "typings"

[tool.codespell]
# "Sammon" (mapping) is a proper noun; "eduction" is the bold-split acronym
# expansion "**R**eduction" in the README title.
ignore-words-list = "sammon,eduction"

[tool.coverage.run]
source = ["pyppur"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = ""

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
arg-type-hints-in-signature = true
check-yield-types = false
skip-checking-raises = true
